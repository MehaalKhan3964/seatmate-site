<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- HTTP to HTTPS fallback: the server-side redirect is a Cloudflare/Pages setting; this covers the gap -->
<script>if(location.protocol==="http:"&&location.hostname==="seatmate.com.pk"){location.replace("https://"+location.host+location.pathname+location.search+location.hash)}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seatmate</title>
<meta name="description" content="Seatmate: carpooling in Pakistan. Find a seat or offer one in your car or on your motorbike.">
<meta name="theme-color" content="#06080f">
<link rel="canonical" href="https://seatmate.com.pk/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F6B4E'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23FAF6EC'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/site.css?v=20261014e">
<meta name="robots" content="noindex">
</head>
<body class="center">
  <div class="card">
    <h1 id="heading">Seat<span>mate</span></h1>
    <p id="message">Carpooling in Pakistan.</p>
    <p id="ride-id-line" hidden></p>
    <div class="links">
      <a class="link download" id="download-link"
         href="https://github.com/MehaalKhan3964/seatmate-site/releases/latest">
        Download for Android
      </a>
      <p class="download-note">Android only. You may need to allow "install unknown apps" when prompted.</p>
      <a class="link" href="/">Seatmate Home</a>
    </div>
  </div>
  <script>
    // This file is GitHub Pages' catch-all: any URL that doesn't match a
    // real file (a 404, status-code-wise) renders this page instead. Used
    // here to give /ride/<id> a landing page without any server-side
    // routing — GitHub Pages can't run one. The HTTP status stays 404, but
    // the HTML renders normally in a real browser; only a status-code-aware
    // crawler (not a person tapping the link) would see it differently.
    //
    // No ride data is fetched or displayed here — the id is only ever read
    // back from the URL itself, for a "your ride is waiting" message, never
    // used to look anything up. Kept to textContent (never innerHTML) and
    // validated as UUID-shaped before display, since it's attacker-influenced
    // input straight from the URL path.
    (function () {
      var match = /^\/ride\/([0-9a-f-]{8,64})\/?$/i.exec(window.location.pathname);
      var rideIdLine = document.getElementById('ride-id-line');
      if (match) {
        var rideId = match[1];
        var isUuidShaped = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(rideId);
        document.getElementById('heading').textContent = 'Open this ride in Seatmate';
        document.getElementById('message').textContent =
          'This link opens a specific ride. Install the Seatmate app to view and book it.';
        if (isUuidShaped) {
          rideIdLine.textContent = 'Ride: ' + rideId;
          rideIdLine.hidden = false;
        }
      } else {
        document.getElementById('heading').textContent = 'Page not found';
        document.getElementById('message').textContent =
          "That page doesn't exist. Head back to the Seatmate homepage below.";
      }
    })();

    // Same download-link upgrade as index.html: point at the exact latest
    // release asset when latest.json is reachable, falling back to GitHub's
    // "latest release" redirect (already in the markup above) otherwise.
    fetch('/latest.json?_=' + Date.now(), { cache: 'no-store' })
      .then((r) => r.json())
      .then((latest) => {
        var el = document.getElementById('download-link');
        if (!el || !latest || typeof latest.apkUrl !== 'string') return;
        el.href = latest.apkUrl;
        if (latest.versionName) {
          el.textContent = 'Download for Android (v' + latest.versionName + ')';
        }
      })
      .catch(function () {
        // Fallback href already in the markup. Nothing to do.
      });
  </script>
<script src="/site.js?v=20261014e" defer></script>
</body>
</html>
